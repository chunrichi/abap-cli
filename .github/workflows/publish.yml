# Publish abap-cli to the official npm registry via npm Trusted Publishing (OIDC).
#
# Prereq: on npmjs.com → package Settings → "Trusted publishing", register this
# repo's workflow file (publish.yml). No NODE_AUTH_TOKEN secret is needed.
#
# Triggers:
#   - pushing a `v*` tag (e.g. `git tag v0.2.6 && git push origin v0.2.6`)
#   - publishing a GitHub Release
#   - manual workflow_dispatch (dry-run only: npm view guard, no publish)
#
# Note: `verify` is NOT run here. The release pipeline trusts verify.yml, which
# gates every push and PR. Tag push implies the tagged commit was already
# verified (either by an earlier push trigger, or by the local pre-push hook).
#
# A pre-publish `npm view` guard makes the job idempotent: if the version is
# already on npm, publish is skipped and the run stays green.
name: publish-to-npm

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (npm view guard only, no publish). verify is not re-run here.'
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing (OIDC)

# Serialize runs for the same tag so a tag push + Release double-trigger never
# races; the second run sees the version already published and skips.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # keytar (used by src/abap_cli/config/secrets.ts for OS keychain access)
      # dlopens libsecret on Linux. ubuntu-latest runners don't ship it, and
      # src/index.ts eagerly awaits loadConfig() → getPassword() at module load
      # so even `abap --help` triggers the dlopen. Install before `npm ci`.
      - name: Install libsecret for keytar
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Resolve package version
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: published
        run: |
          if npm view abap-cli@${{ steps.version.outputs.version }} version \
            --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::abap-cli@${{ steps.version.outputs.version }} already published on npm — skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.already == 'false' && github.event_name != 'workflow_dispatch'
        run: npm publish --registry=https://registry.npmjs.org

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Dry run complete — npm view guard ran, but publish was skipped (workflow_dispatch). Verify ran via verify.yml on the commit that introduced this tag."
