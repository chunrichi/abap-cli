# Verify abap-cli on every push and PR.
#
# Runs `npm run verify` (build + tests). publish.yml no longer re-runs verify —
# the release pipeline trusts this gate. Local pre-push hook (`.githooks/pre-push`,
# wired via core.hooksPath by `scripts/setup-hooks.sh`) is the developer-side
# counterpart.
name: verify

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # keytar dlopens libsecret on Linux runners.
      - name: Install libsecret for keytar
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run verify
        run: npm run verify
